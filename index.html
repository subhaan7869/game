<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3590152533738920"
     crossorigin="anonymous"></script>
    <link rel="manifest" href="/manifest.json" />
    <title>Uber Eats Driver Dashboard</title>
  </head>
  <body>
    <div id="root">
      <div style="background: #000; height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
        <h1 style="color: #fff; margin-bottom: 12px; font-weight: 900; font-style: italic; letter-spacing: -1px; font-size: 32px;">UBER EATS</h1>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 12px; height: 12px; border: 2px solid #3b82f6; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
          <p style="font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 3px; color: #3b82f6;">Initializing System</p>
        </div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
